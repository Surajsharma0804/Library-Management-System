# Build native installers for Windows and macOS, run tests,
# then upload everything to a GitHub Release.
#
# Triggered by pushing a version tag like v2.0.0
# Manual trigger also supported via workflow_dispatch.

name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run test suite
        run: mvn test -q

  build-windows:
    name: Windows Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build fat JAR
        run: mvn package -DskipTests -q

      - name: Build EXE installer
        shell: pwsh
        run: |
          jpackage --type exe `
            --name "Library Management System" `
            --app-version "${{ steps.version.outputs.VERSION }}" `
            --vendor "Central Library" `
            --description "University Central Library Management System" `
            --icon "installer/app-icon.ico" `
            --input "target" `
            --main-jar "library-management-system-1.0.0.jar" `
            --main-class "com.library.Main" `
            --dest "installer/output" `
            --win-dir-chooser --win-menu --win-shortcut `
            --java-options "-Xmx512m"

      - name: Build MSI installer
        shell: pwsh
        run: |
          jpackage --type msi `
            --name "Library Management System" `
            --app-version "${{ steps.version.outputs.VERSION }}" `
            --vendor "Central Library" `
            --description "University Central Library Management System" `
            --icon "installer/app-icon.ico" `
            --input "target" `
            --main-jar "library-management-system-1.0.0.jar" `
            --main-class "com.library.Main" `
            --dest "installer/output" `
            --win-dir-chooser --win-menu --win-shortcut `
            --java-options "-Xmx512m"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installer/output/*
          retention-days: 5

  build-macos:
    name: macOS Installer
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build fat JAR
        run: mvn package -DskipTests -q

      - name: Build DMG installer
        run: |
          jpackage --type dmg \
            --name "Library Management System" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --vendor "Central Library" \
            --description "University Central Library Management System" \
            --input "target" \
            --main-jar "library-management-system-1.0.0.jar" \
            --main-class "com.library.Main" \
            --dest "installer/output" \
            --java-options "-Xmx512m"

      - name: Build PKG installer
        run: |
          jpackage --type pkg \
            --name "Library Management System" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --vendor "Central Library" \
            --description "University Central Library Management System" \
            --input "target" \
            --main-jar "library-management-system-1.0.0.jar" \
            --main-class "com.library.Main" \
            --dest "installer/output" \
            --java-options "-Xmx512m"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: installer/output/*
          retention-days: 5

  build-jar:
    name: Cross-Platform JAR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build fat JAR
        run: mvn package -DskipTests -q

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-jar
          path: target/library-management-system-1.0.0.jar
          retention-days: 5

  release:
    name: Create Release
    needs: [build-windows, build-macos, build-jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Library Management System v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/windows-installers/*
            release-assets/macos-installers/*
            release-assets/cross-platform-jar/*
          body: |
            ## Library Management System v${{ steps.version.outputs.VERSION }}

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | Windows | `.exe` | Setup wizard installer |
            | Windows | `.msi` | MSI package for IT deployment |
            | macOS | `.dmg` | Disk image installer |
            | macOS | `.pkg` | Package installer |
            | Any OS | `.jar` | Run with `java -jar` (requires Java 21) |

            ### Web App (PWA)
            Run the web server and open in any browser:
            ```bash
            java -cp library-management-system-1.0.0.jar com.library.WebMain
            ```
            Works on desktop, tablet, and mobile. Installable via "Add to Home Screen" on Android and iOS.

            ### Default Credentials
            | Username | Password | Role |
            |----------|----------|------|
            | admin | admin@123 | Administrator |
